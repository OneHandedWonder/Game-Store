name: game-store

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: game_store
      POSTGRES_USER: game_store
      POSTGRES_PASSWORD: game_store_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_store -d game_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
